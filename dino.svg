<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-label="Debarpan - dino runner animation">
  <style>
    .dino { animation: jump 4s infinite; }
    .legA { animation: step 0.28s steps(1) infinite; }
    .legB { animation: step 0.28s steps(1) infinite; animation-delay: -0.14s; }
    .cactus { animation: scroll 4s linear infinite; }
    .cloud1 { animation: drift 14s linear infinite; }
    .cloud2 { animation: drift 14s linear infinite; animation-delay: -7s; }
    .ground { animation: groundmove 0.6s linear infinite; }

    @keyframes jump {
      0%, 72% { transform: translateY(0); animation-timing-function: cubic-bezier(.15,.7,.35,1); }
      82%     { transform: translateY(-60px); animation-timing-function: cubic-bezier(.65,0,.85,.3); }
      92%, 100% { transform: translateY(0); }
    }
    @keyframes step {
      0%   { transform: translateY(0); }
      50%  { transform: translateY(-5px); }
    }
    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-880px); }
    }
    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(-900px); }
    }
    @keyframes groundmove {
      to { stroke-dashoffset: -24; }
    }
  </style>

  <defs>
    <clipPath id="reveal">
      <rect x="200" y="30" height="80" width="0">
        <animate attributeName="width" dur="8s" repeatCount="indefinite"
                 values="0;400;400;0" keyTimes="0;0.4;0.9;1" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="798" height="198" rx="12" fill="#0d1117" stroke="#30363d"/>

  <!-- clouds -->
  <g class="cloud1" fill="#30363d">
    <g transform="translate(820,40)">
      <rect x="0" y="6" width="44" height="6"/>
      <rect x="10" y="0" width="24" height="6"/>
    </g>
  </g>
  <g class="cloud2" fill="#30363d">
    <g transform="translate(820,70)">
      <rect x="0" y="6" width="36" height="6"/>
      <rect x="8" y="0" width="20" height="6"/>
    </g>
  </g>

  <!-- name -->
  <g clip-path="url(#reveal)">
    <text x="400" y="85" text-anchor="middle" font-family="'Courier New', Courier, monospace"
          font-size="54" font-weight="700" letter-spacing="8" fill="#e6edf3">DEBARPAN</text>
  </g>
  <text x="400" y="112" text-anchor="middle" font-family="'Courier New', Courier, monospace"
        font-size="14" letter-spacing="3" fill="#8b949e">ASPIRING SOFTWARE ENGINEER</text>

  <!-- ground -->
  <line x1="0" y1="152" x2="800" y2="152" stroke="#484f58" stroke-width="2"/>
  <line class="ground" x1="0" y1="160" x2="800" y2="160" stroke="#30363d" stroke-width="2" stroke-dasharray="10 14"/>

  <!-- cactus cluster -->
  <g transform="translate(820,150)">
    <g class="cactus" fill="#8b949e">
      <rect x="0" y="-30" width="8" height="30"/>
      <rect x="-5" y="-19" width="5" height="3"/>
      <rect x="-5" y="-25" width="3" height="9"/>
      <rect x="8" y="-14" width="5" height="3"/>
      <rect x="10" y="-20" width="3" height="9"/>
      <g transform="translate(18,0)">
        <rect x="0" y="-22" width="7" height="22"/>
        <rect x="-4" y="-14" width="4" height="3"/>
        <rect x="-4" y="-19" width="3" height="8"/>
      </g>
    </g>
  </g>

  <!-- dino -->
  <g transform="translate(100,150)">
    <g class="dino" fill="#c9d1d9">
      <rect x="-8" y="-26" width="8" height="6"/>
      <rect x="-4" y="-20" width="4" height="4"/>
      <rect x="0" y="-28" width="24" height="18"/>
      <rect x="16" y="-36" width="8" height="10"/>
      <rect x="16" y="-48" width="22" height="14"/>
      <rect x="24" y="-22" width="6" height="3"/>
      <rect x="29" y="-45" width="3" height="3" fill="#0d1117"/>
      <rect x="28" y="-38" width="10" height="2" fill="#0d1117"/>
      <g class="legA"><rect x="4" y="-10" width="5" height="10"/></g>
      <g class="legB"><rect x="15" y="-10" width="5" height="10"/></g>
    </g>
  </g>
</svg>
